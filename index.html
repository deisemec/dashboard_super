function refreshMonthList(preferred){MONTHS=Object.keys(DATA).sort(sortMonths);if(preferred&&DATA[preferred])current=preferred;else if(!DATA[current])current=MONTHS[0]||'';}


function stat(d){
  const t=monthType(current);
  if(t==='anual')return ['neutral','Registro anual'];
  if(t==='junho'){
    const need=upper(d.necessidade_aai);
    const goodNeed=need==='NÃO'||(need==='SIM'&&norm(d.processo_sei));
    const goodMp=upper(d.mp)==='SIM'||upper(d.mp)==='NÃO';
    if(goodNeed&&goodMp)return ['ok','Completo'];
    if(!goodNeed&&!goodMp)return ['bad','Atenção'];
    return ['warn','Em acompanhamento'];
  }
  if(t==='julho'){
    const need=upper(d.necessidade_aai);
    const goodNeed=need==='NÃO'||(need==='SIM'&&norm(d.processo_sei));
    const ins=upper(d.insercao_avaliativa);
    const goodIns=ins==='SIM'||(ins==='NÃO'&&norm(d.motivo_insercao));
    if(goodNeed&&goodIns)return ['ok','Completo'];
    if(!goodNeed&&!goodIns)return ['bad','Atenção'];
    return ['warn','Em acompanhamento'];
  }
  if(t==='agosto'){
    const n=[d.professores,d.aai,d.novatos].filter(yes).length;
    return n===3?['ok','Completo']:n===0?['bad','Atenção']:['warn','Em acompanhamento'];
  }
  if(t==='setembro'){
    const n=[
      upper(d.projeto)==='SIM',
      yes(d.aai),
      upper(d.mp)==='NÃO' || upper(d.mp)==='SIM',
      upper(d.desreg)==='NÃO' || upper(d.desreg)==='SIM'
    ].filter(Boolean).length;
    return n>=4?['ok','Completo']:n===0?['bad','Atenção']:['warn','Em acompanhamento'];
  }
  if(t==='fevmar'){
    const p=upper(d.participacao);
    const a=upper(d.aee_organizacao);
    const goodP=p.startsWith('SIM');
    const goodA=a.includes('JÁ CUMPRIU TODA');
    if(goodP&&goodA) return ['ok','Completo'];
    if(!goodP&&!goodA) return ['bad','Atenção'];
    return ['warn','Em acompanhamento'];
  }
  if(t==='abril'){
    const p=upper(d.paee);
    const pr=upper(d.projeto);
    const goodP=p.includes('INSERIU TOTALMENTE');
    const goodPr=pr==='SIM';
    if(goodP&&goodPr) return ['ok','Completo'];
    if(!goodP&&!goodPr) return ['bad','Atenção'];
    return ['warn','Em acompanhamento'];
  }
  return ['neutral','Registro'];
}

function monthType(m){if(m==='2026')return 'anual';if(m==='Consolidado')return 'consolidado';const rows=DATA[m]||[],inferred=inferSchema(rows);if(inferred!=='generic')return inferred;if(m.startsWith('Fevereiro')||m.startsWith('Março'))return 'fevmar';if(m.startsWith('Abril'))return 'abril';if(m.startsWith('Junho'))return 'junho';if(m.startsWith('Julho'))return 'julho';if(m.startsWith('Agosto'))return 'agosto';if(m.startsWith('Setembro')||m.startsWith('Outubro'))return 'setembro';return 'generic';}


function card(icon,num,label){
  return `<div class="col-6 col-xl-2"><div class="kpi"><i class="bi ${icon}"></i><div class="num">${num}</div><div class="lbl">${label}</div></div></div>`;
}

function normKey(s){return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
function personKey(s){return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function titleName(s){
  const small=new Set(['da','de','do','das','dos','e']);
  return norm(s).toLocaleLowerCase('pt-BR').split(/\s+/).map((w,i)=>small.has(w)&&i>0?w:w.charAt(0).toLocaleUpperCase('pt-BR')+w.slice(1)).join(' ');
}
function annualRows(){
  return Object.entries(DATA).filter(([m])=>m!=='2026').flatMap(([m,rows])=>rows.map(d=>({...d,_month:m})));
}
let SEARCH_QUERY='';
function setSearch(value){
  SEARCH_QUERY=String(value??'');
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById('q');
    if(el){el.focus();const p=el.value.length;el.setSelectionRange(p,p);}
  });
}
function getRows(){
  const q=normKey(SEARCH_QUERY);
  const rows=(current==='2026'||current==='Consolidado')?annualRows():(DATA[current]||[]).map(d=>({...d,_month:current}));
  if(!q)return rows;
  return rows.filter(d=>{
    const sup=normKey(d.superintendente);
    const uni=normKey(d.unidade);
    return sup.includes(q)||uni.includes(q);
  });
}

function tabs(){
  const list=['Consolidado',...MONTHS.filter(m=>m!=='2026')];

}

function sourceSchema(headers){
  const h=headers.map(x=>upper(x));
  const joined=h.join(' ');
  if(joined.includes('PROJETO INTERDISCIPLINAR INCLUSIVO'))return 'setembro';
  if(joined.includes('MOBIEDUCA'))return 'julho';
  if(joined.includes('PROCESSOS DE MP')||joined.includes('HÁ PROCESSOS DE MP'))return 'junho';
  return 'generic';
}
function headerIndex(headers,patterns){
  const hs=headers.map(x=>normalizeFileName(String(x)));
  for(const p of patterns){
    const q=normalizeFileName(p);
    const i=hs.findIndex(h=>h.includes(q));
    if(i>=0)return i;
  }
  return -1;
}
function normalizeImportedRows(rows,headers,schema){
  const iTs=0,
        iSup=headerIndex(headers,['NOME DO SUPERINTENDENTE']),
        iUnit=headerIndex(headers,['NOME DA UNIDADE DE ENSINO']),
        iAaiLot=headerIndex(headers,['QUANTOS AAI TEM LOTADOS']),
        iNeed=headerIndex(headers,['AINDA HÁ NECESSIDADE DE AAI']),
        iProcess=headerIndex(headers,['Nº DO PROCESSO SEI','PROCESSO SEI']),
        iMp=headerIndex(headers,['HÁ PROCESSOS DE MP','PROCESSOS DE MP']),
        iDetail=headerIndex(headers,['NOME DO ESTUDANTE E A SOLICITAÇÃO','CASO "SIM", INFORME O NOME DO ESTUDANTE','CASO "NÃO", INFORME OS MOTIVOS']),
        iProject=headerIndex(headers,['1-O PROFESSOR DE AEE JÁ ESTÁ REALIZANDO O PROJETO INTERDISCIPLINAR INCLUSIVO']),
        iProjectDetail=headerIndex(headers,['1.1- CASO "SIM", QUAL O NOME DO PROJETO']),
        iAaiForm=headerIndex(headers,['2- O PROFESSOR DE AEE FEZ FORMAÇÃO PARA OS AUXILIARES DE APOIO À INCLUSÃO','2-  O PROFESSOR DE AEE FEZ FORMAÇÃO PARA OS AUXILIARES DE APOIO À INCLUSÃO']),
        iAaiJust=headerIndex(headers,['2.1- CASO "NÃO", QUAL A JUSTIFICATIVA']),
        iMpSep=headerIndex(headers,['3. A UNIDADE DE ENSINO FOI NOTIFICADA']),
        iMpSepDetail=headerIndex(headers,['3.1- CASO "SIM", REFERENTE A QUAL(IS) ESTUDANTE(S)']),
        iDesreg=headerIndex(headers,['4. A UNIDADE DE ENSINO POSSUI ESTUDANTES QUE APRESENTAM DESREGULAÇÕES SEVERAS/ AGRESSIVAS','4. A UNIDADE DE ENSINO POSSUI ESTUDANTES QUE APRESENTAM DESREGULAÇÕES SEVERAS']),
        iDesregDetail=headerIndex(headers,['4.1 CASO "SIM", QUAL O NOME DO(S) ESTUDANTE(S)','4.1  CASO "SIM", QUAL O NOME DO(S) ESTUDANTE(S)']);

  return rows.filter(r=>r&&r.some(v=>String(v??'').trim()!=='')).map(r=>{
    const ts=norm(r[iTs]),
          sup=norm(r[iSup]),
          unit=norm(r[iUnit]),
          raw=norm(r[iAaiLot]);
    let d={timestamp:ts,superintendente:sup,unidade:unit};

    if(schema==='setembro'){
      d.projeto=norm(r[iProject]);
      d.projeto_detalhe=norm(r[iProjectDetail]);
      d.aai=norm(r[iAaiForm]);
      d.just_aai=norm(r[iAaiJust]);
      d.mp=norm(r[iMpSep]);
      d.mp_detalhe=norm(r[iMpSepDetail]);
      d.desreg=norm(r[iDesreg]);
      d.desreg_detalhe=norm(r[iDesregDetail]);
    }else{
      d.aai_lotados_raw=raw;
      d.aai_lotados_total=totalNums(raw);
      d.necessidade_aai=norm(r[iNeed]);
      if(schema==='junho')Object.assign(d,{processo_sei:norm(r[iProcess]),mp:norm(r[iMp]),mp_detalhe:norm(r[iDetail])});
      else if(schema==='julho')Object.assign(d,{insercao_avaliativa:norm(r[iMp]),motivo_insercao:norm(r[iDetail])});
      else{
        d.campos={};
        headers.forEach((h,idx)=>{if(h)d.campos[h]=norm(r[idx]);});
      }
    }
    return d;
  }).filter(d=>d.superintendente||d.unidade);
}
async function importXlsx(file){
  if(!file)return;
  try{
    const month=monthFromName(file.name)||prompt('Não identifiquei o mês no nome do arquivo. Informe, por exemplo: Outubro 2026');
    if(!month)return;
    const buf=await file.arrayBuffer();
    const book=XLSX.read(buf,{type:'array',cellDates:true});
    const sheet=book.Sheets[book.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
    if(!rows.length){alert('A planilha está vazia.');return;}
    const headers=rows[0].map(v=>String(v??'').trim());
    const schema=sourceSchema(headers);
    const imported=normalizeImportedRows(rows.slice(1),headers,schema);
    if(!imported.length){alert('Não encontrei registros aproveitáveis na primeira aba.');return;}

    // Regra de atualização: o mês identificado pelo nome do arquivo é SUBSTITUÍDO
    // integralmente. Isso evita duplicação quando a nova planilha é uma versão
    // atualizada do mesmo mês (ex.: Setembro 34 -> Setembro 77).
    const previousCount=Array.isArray(DATA[month])?DATA[month].length:0;
    DATA[month]=imported;
    SOURCES[month]=file.name;

    refreshMonthList(month);
    saveState();
    tabs();
    render();

    alert(`${month} substituído com sucesso. ${previousCount} registro(s) anterior(es) → ${imported.length} registro(s) atualizado(s). Nenhum registro antigo desse mês foi somado.`);
  }catch(e){
    console.error(e);
    alert('Não foi possível incorporar a planilha. Verifique se o arquivo é XLSX/XLS válido.');
  }
}
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files?.[0];
  if(f)importXlsx(f);
  e.target.value='';
});


function buildAnnualGroups(rows){
  const bySup=new Map();
  rows.forEach(d=>{
    const sk=personKey(d.superintendente)||'(SEM SUPERINTENDENTE)';
    let sg=bySup.get(sk);
    if(!sg){sg={key:sk,display:titleName(d.superintendente)||'(Sem superintendente)',rows:[],units:new Map()};bySup.set(sk,sg);}
    sg.rows.push(d);
    const uk=normKey(d.unidade)||'(SEM UNIDADE)';
    let ug=sg.units.get(uk);
    if(!ug){ug={key:uk,display:norm(d.unidade)||'(Sem unidade)',rows:[],months:new Set()};sg.units.set(uk,ug);}
    ug.rows.push(d);ug.months.add(d._month||'');
  });
  return [...bySup.values()].sort((a,b)=>a.display.localeCompare(b.display,'pt-BR')).map(g=>({...g,units:[...g.units.values()].sort((a,b)=>a.display.localeCompare(b.display,'pt-BR'))}));
}
function annualUnitSummary(ug){
  const months=[...ug.months].filter(Boolean).sort(sortMonths);
  return `<span class="pill neutral">${ug.rows.length} registro${ug.rows.length===1?'':'s'}</span>`+
    months.map(m=>`<span class="annual-month">${esc(m.replace(' 2026',''))}</span>`).join('');
}

function annualRecordFields(d){
  const out=[];
  const labels={
    timestamp:'Data/hora do registro',superintendente:'Superintendente',unidade:'Unidade',participacao:'Participação do professor de AEE',novos:'Novos estudantes / cadastro GED',demandas:'Demandas acompanhadas',demanda_detalhe:'Detalhe das demandas',aee_organizacao:'Organização do atendimento AEE',laudo:'Estudantes PEE com laudo',aai_qtd:'AAI informado',aai_lotados_raw:'AAI lotados (resposta original)',aai_lotados_total:'AAI lotados (quantidade considerada)',necessidade_aai:'Ainda há necessidade de AAI?',processo_sei:'Processo SEI',mp:'Processos/notificação MP',mp_detalhe:'Detalhe relacionado ao MP',insercao_avaliativa:'Inserção do registro avaliativo no Mobieduca.me',motivo_insercao:'Motivo/observação',professores:'Formação para professores',aai:'Formação para AAI',novatos:'Alunos novatos',quantidade:'Quantidade informada',just_prof:'Justificativa — professores',just_aai:'Justificativa — AAI',projeto:'Projeto interdisciplinar inclusivo',projeto_detalhe:'Detalhe do projeto',desreg:'Desregulações severas/agressivas',desreg_detalhe:'Detalhe da desregulação',inicio:'Início dos atendimentos',reserva:'Cadastro de reserva para AEE',reserva_detalhe:'Reserva — estudantes / nomes',paee:'Inserção do PAEE no Mobieduca.me',paee_obs:'Observações do PAEE',observacoes:'Outras observações',obs1:'Observações — item 1',obs2:'Observações — item 2',obs4:'Observações — item 4'
  };
  for(const [k,v] of Object.entries(d)){
    if(k==='_month'||k==='campos'||v===null||v===undefined||String(v)==='')continue;
    out.push(annualModalField(labels[k]||k,v));
  }
  if(d.campos){for(const [k,v] of Object.entries(d.campos)){if(String(v||'')!=='')out.push(annualModalField(k,v));}}
  return out.join('');
}

  if(t==='agosto')
    return `<span class="pill ${yes(d.professores)?'ok':'bad'}">Professores: ${yes(d.professores)?'Sim':'Não'}</span>
            <span class="pill ${yes(d.aai)?'ok':'bad'}">AAI: ${yes(d.aai)?'Sim':'Não'}</span>
            <span class="pill ${yes(d.novatos)?'ok':'neutral'}">Novatos: ${yes(d.novatos)?'Sim':'Não'}</span>`;
  if(t==='setembro')
    return `<span class="pill ${upper(d.projeto)==='SIM'?'ok':'bad'}">Projeto: ${upper(d.projeto)||'—'}</span>
            <span class="pill ${yes(d.aai)?'ok':'bad'}">AAI: ${yes(d.aai)?'Sim':'Não'}</span>
            <span class="pill neutral">MP: ${upper(d.mp)||'—'}</span>
            <span class="pill neutral">Desreg.: ${upper(d.desreg)||'—'}</span>`;
  if(t==='fevmar')
    return `<span class="pill ${upper(d.participacao).startsWith('SIM')?'ok':'bad'}">Participação: ${upper(d.participacao).startsWith('SIM')?'Sim':'Não'}</span>
            <span class="pill ${upper(d.aee_organizacao).includes('JÁ CUMPRIU TODA')?'ok':'warn'}">AEE: ${upper(d.aee_organizacao).includes('JÁ CUMPRIU TODA')?'Concluído':'Em andamento'}</span>
            <span class="pill neutral">Laudo: ${d.laudo||0}</span>`;
  if(t==='abril')
    return `<span class="pill ${upper(d.paee).includes('INSERIU TOTALMENTE')?'ok':upper(d.paee).includes('PARCIALMENTE')?'warn':'bad'}">PAEE: ${upper(d.paee).includes('INSERIU TOTALMENTE')?'Total':upper(d.paee).includes('PARCIALMENTE')?'Parcial':'Não'}</span>
            <span class="pill ${upper(d.projeto)==='SIM'?'ok':upper(d.projeto).includes('PRODUZ')?'warn':'bad'}">Projeto: ${upper(d.projeto)==='SIM'?'Sim':upper(d.projeto).includes('PRODUZ')?'Em produção':'Não'}</span>
            <span class="pill neutral">Reserva: ${upper(d.reserva)||'—'}</span>`;
  return '';
}

}

function detail(label,value){
  return `<div class="detail"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}

  } else if(t==='julho'){
    content+=detail('Quantidade de AAI lotados (resposta original)',esc(d.aai_lotados_raw||'—'));content+=detail('Quantidade considerada no indicador',String(d.aai_lotados_total||0));content+=detail('Ainda há necessidade de AAI?',esc(d.necessidade_aai||'—'));content+=detail('Inserção do registro avaliativo no Mobieduca.me',esc(d.insercao_avaliativa||'—'));content+=`<div class="col-12">${detail('Motivo / observação',esc(d.motivo_insercao||'—'))}</div>`;
  } else if(t==='generic'){
    const entries=Object.entries(d.campos||{});for(const [label,val] of entries)content+=`<div class="col-12 col-md-6">${detail(label,esc(val||'—'))}</div>`;
  } else if(t==='fevmar'){

    content+=`<div class="col-12">${detail('Detalhe das demandas',esc(d.demanda_detalhe||'—'))}</div>`;

  } else if(t==='abril'){

    content+=detail('Cadastro de reserva para AEE',esc(d.reserva||'—'));
    content+=detail('Inserção do PAEE no Mobieduca.me',esc(d.paee||'—'));
    content+=detail('Projeto interdisciplinar',esc(d.projeto||'—'));
    content+=`<div class="col-12">${detail('Reserva — estudantes / nomes',esc(d.reserva_detalhe||'—'))}</div>`;
    content+=`<div class="col-12">${detail('Observações do PAEE',esc(d.paee_obs||'—'))}</div>`;

  content+='</div>';

function numericValue(d,keys){
  for(const k of keys){
    const raw=d?.[k];
    if(raw===null||raw===undefined||String(raw).trim()==='')continue;
    const n=Number(String(raw).replace(',','.'));
    if(Number.isFinite(n))return n;
  }
  return 0;
}
function buildConsolidatedGroups(rows){
  const map=new Map();
  rows.forEach(d=>{
    const sk=personKey(d.superintendente)||'(SEM SUPERINTENDENTE)';
    const uk=normKey(d.unidade)||'(SEM UNIDADE)';
    const key=sk+'||'+uk;
    let g=map.get(key);
    if(!g){g={key,displaySup:titleName(d.superintendente)||'(Sem superintendente)',displayUnit:norm(d.unidade)||'(Sem unidade)',rows:[],months:new Set()};map.set(key,g);}
    g.rows.push(d);g.months.add(d._month||'');
  });
  return [...map.values()].sort((a,b)=>a.displaySup.localeCompare(b.displaySup,'pt-BR')||a.displayUnit.localeCompare(b.displayUnit,'pt-BR'));
}
function consolidatedStats(g){
  const r=g.rows;
  return {
    registros:r.length, meses:new Set(r.map(d=>d._month).filter(Boolean)).size,
    laudo:r.reduce((s,d)=>s+(Number(d.laudo)||0),0),
    aai:r.reduce((s,d)=>s+numericValue(d,['aai_qtd','aai_lotados_total','aai_lotados_raw']),0),
    alunos:r.reduce((s,d)=>s+numericValue(d,['quantidade']),0),
    necessidade:r.filter(d=>upper(d.necessidade_aai)==='SIM').length,
    sei:r.filter(d=>norm(d.processo_sei)).length,
    mp:r.filter(d=>upper(d.mp)==='SIM').length,
    avaliativo:r.filter(d=>upper(d.insercao_avaliativa)==='SIM').length,
    projeto:r.filter(d=>upper(d.projeto)==='SIM').length,
    desreg:r.filter(d=>upper(d.desreg)==='SIM').length,
    formProf:r.filter(d=>yes(d.professores)).length,
    formAAI:r.filter(d=>yes(d.aai)).length,
    novatos:r.filter(d=>yes(d.novatos)).length
  };
}
function openConsolidatedUnit(index){
  const g=CONSOLIDATED_GROUPS[index];
  if(!g)return;
  document.getElementById('title').textContent=g.displayUnit;
  let content=`<div class="mb-3"><span class="pill neutral">${esc(g.displaySup)}</span><span class="pill neutral">${g.rows.length} registro${g.rows.length===1?'':'s'} no consolidado</span><span class="pill neutral">${g.months.size} mês${g.months.size===1?'':'es'}</span></div>`;
  const rows=[...g.rows].sort((a,b)=>sortMonths(a._month||'',b._month||'')||norm(a.timestamp).localeCompare(norm(b.timestamp)));
  content+='<div class="d-flex flex-column gap-3">';
  rows.forEach((d,i)=>{
    content+=`<div class="annual-record"><div class="annual-record-head"><div><div class="annual-record-title">${esc(d._month||'Período')} · Registro ${i+1}</div><div class="small text-secondary">${esc(d.timestamp||'')}</div></div><span class="annual-month">${esc(d._month||'')}</span></div><div class="row g-2">${annualRecordFields(d)}</div></div>`;
  });
  content+='</div>';
  document.getElementById('body').innerHTML=content;
  new bootstrap.Modal(document.getElementById('modal')).show();
}
function renderConsolidated(){
  const arr=getRows();
  CONSOLIDATED_GROUPS=buildConsolidatedGroups(arr);
  const sourceMonths=[...new Set(arr.map(d=>d._month).filter(Boolean))].sort(sortMonths);
  const all=arr;
  const total=all.reduce((s,d)=>s+1,0);
  const totals=all.reduce((s,d)=>{const x=consolidatedStats({rows:[d]});return {
    laudo:s.laudo+x.laudo,aai:s.aai+x.aai,alunos:s.alunos+x.alunos,necessidade:s.necessidade+x.necessidade,sei:s.sei+x.sei,mp:s.mp+x.mp,avaliativo:s.avaliativo+x.avaliativo,projeto:s.projeto+x.projeto,desreg:s.desreg+x.desreg,formProf:s.formProf+x.formProf,formAAI:s.formAAI+x.formAAI,novatos:s.novatos+x.novatos
  }},{laudo:0,aai:0,alunos:0,necessidade:0,sei:0,mp:0,avaliativo:0,projeto:0,desreg:0,formProf:0,formAAI:0,novatos:0});
  let h=`<div class="row g-3 mb-4">${renderCards(arr)}</div>`;
  h+=`<div class="mb-3">
    <div><h2 class="h5 fw-bold mb-1">Consolidado — todos os meses</h2>
    <div class="small text-secondary">Soma dos registros de todos os meses atualmente incorporados. Valores numéricos são somados; indicadores de ocorrência são contabilizados. Clique na unidade para ver todos os registros que compõem o total.</div></div>
    <div class="search d-flex align-items-center gap-2 mt-3" style="max-width:100%;"><i class="bi bi-search text-secondary"></i><input id="q" class="form-control" placeholder="Pesquisar Superintendente OU Unidade" oninput="setSearch(this.value)" value="${esc(SEARCH_QUERY)}"></div>
  </div>`;
  h+=`<div class="annual-summary mb-4"><div class="p-3 border-bottom" style="border-color:var(--line)!important"><b>Meses incluídos</b></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mês</th><th>Registros</th><th>Superintendentes</th><th>Unidades</th></tr></thead><tbody>`;
  sourceMonths.forEach(m=>{const rows=arr.filter(r=>r._month===m);const sups=new Set(rows.map(r=>personKey(r.superintendente)).filter(Boolean));const uns=new Set(rows.map(r=>normKey(r.unidade)).filter(Boolean));h+=`<tr><td><span class="annual-month">${esc(m.replace(' 2026',''))}</span></td><td><b>${rows.length}</b></td><td>${sups.size}</td><td>${uns.size}</td></tr>`});
  h+=`<tr class="fw-bold"><td>Total somado</td><td>${total}</td><td>${new Set(all.map(r=>personKey(r.superintendente)).filter(Boolean)).size}</td><td>${new Set(all.map(r=>normKey(r.unidade)).filter(Boolean)).size}</td></tr></tbody></table></div></div>`;
  h+=`<div class="consolidated-table table-responsive"><table class="table align-middle"><thead><tr><th>Superintendente</th><th>Unidade</th><th>Registros</th><th>Meses</th><th>PEE com laudo</th><th>AAI</th><th>Alunos</th><th>Necessidade AAI</th><th>Processos SEI</th><th>MP</th><th>Aval. inserida</th><th>Projeto</th><th>Desreg. severa</th><th>Form. professores</th><th>Form. AAI</th><th>Novatos</th></tr></thead><tbody>`;
  CONSOLIDATED_GROUPS.forEach((g,i)=>{const x=consolidatedStats(g);h+=`<tr class="consolidated-click" onclick="openConsolidatedUnit(${i})"><td><b>${esc(g.displaySup)}</b></td><td>${esc(g.displayUnit)}</td><td>${x.registros}</td><td>${x.meses}</td><td>${x.laudo}</td><td>${x.aai}</td><td>${x.alunos||'—'}</td><td>${x.necessidade}</td><td>${x.sei}</td><td>${x.mp}</td><td>${x.avaliativo}</td><td>${x.projeto}</td><td>${x.desreg}</td><td>${x.formProf}</td><td>${x.formAAI}</td><td>${x.novatos}</td></tr>`});
  h+=`<tr class="total-row"><td colspan="2">TOTAL ${SEARCH_QUERY.trim()?'FILTRADO':'GERAL'}</td><td>${total}</td><td>${new Set(all.map(r=>r._month).filter(Boolean)).size}</td><td>${totals.laudo}</td><td>${totals.aai}</td><td>${totals.alunos||'—'}</td><td>${totals.necessidade}</td><td>${totals.sei}</td><td>${totals.mp}</td><td>${totals.avaliativo}</td><td>${totals.projeto}</td><td>${totals.desreg}</td><td>${totals.formProf}</td><td>${totals.formAAI}</td><td>${totals.novatos}</td></tr>`;
  h+='</tbody></table></div>';
  document.getElementById('app').innerHTML=h;
  if(document.getElementById('footerInfo'))document.getElementById('footerInfo').textContent=`Consolidado · ${sourceMonths.length} meses · ${total} registros somados · indicadores recalculados automaticamente.`;
}

function renderAnnual(){
  const arr=getRows();
  const sourceRows=arr;
  ANNUAL_GROUPS=buildAnnualGroups(arr);
  const sourceMonths=[...new Set(arr.map(d=>d._month).filter(Boolean))].sort(sortMonths);
  let h=`<div class="row g-3 mb-4">${renderCards(arr)}</div>`;
  h+=`<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-3">
    <div><h2 class="h5 fw-bold mb-1">Resumo consolidado de 2026</h2>
    <div class="small text-secondary">Todos os registros atualmente incorporados no painel, consolidados por superintendente e unidade. Os totais são recalculados quando novos meses são incorporados.</div></div>
    <div class="search d-flex align-items-center gap-2"><i class="bi bi-search text-secondary"></i>
    <input id="q" placeholder="Pesquisar superintendente ou unidade" oninput="setSearch(this.value)" value="${esc(SEARCH_QUERY)}"></div>
  </div>`;
  h+=`<div class="annual-summary mb-4"><div class="p-3 border-bottom" style="border-color:var(--line)!important"><b>Resumo por mês</b></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mês</th><th>Registros</th><th>Superintendentes</th><th>Unidades</th></tr></thead><tbody>`;
  sourceMonths.forEach(m=>{
    const rows=DATA[m]||[];
    const sups=new Set(rows.map(r=>personKey(r.superintendente)).filter(Boolean));
    const uns=new Set(rows.map(r=>normKey(r.unidade)).filter(Boolean));
    h+=`<tr><td><span class="annual-month">${esc(m.replace(' 2026',''))}</span></td><td><b>${rows.length}</b></td><td>${sups.size}</td><td>${uns.size}</td></tr>`;
  });
  h+=`<tr class="fw-bold"><td>Total do ano</td><td>${sourceRows.length}</td><td>${new Set(sourceRows.map(r=>personKey(r.superintendente)).filter(Boolean)).size}</td><td>${new Set(sourceRows.map(r=>normKey(r.unidade)).filter(Boolean)).size}</td></tr></tbody></table></div></div>`;
  h+=`<div class="mb-3"><h2 class="h5 fw-bold mb-1">Superintendentes — consolidado anual</h2><div class="small text-secondary">Cada unidade aparece uma vez na consolidação; clique na unidade para visualizar todos os registros do ano.</div></div><div class="row g-3">`;
  ANNUAL_GROUPS.forEach((group,gi)=>{
    h+=`<div class="col-12 col-md-6 col-xl-4"><div class="super"><div class="super-head d-flex justify-content-between align-items-center" onclick="toggle('as${gi}',this)"><div><div class="name">${esc(group.display)}</div><div class="meta">${group.rows.length} registro${group.rows.length===1?'':'s'} · ${group.units.length} unidade${group.units.length===1?'':'s'} · ${new Set(group.rows.map(r=>r._month)).size} meses</div></div><i class="bi bi-chevron-down"></i></div><div id="as${gi}" class="unit-list d-none">`;
    group.units.forEach((ug,ui)=>{
      h+=`<div class="unit" onclick="openAnnualUnit(${gi},${ui})"><div class="d-flex justify-content-between gap-2"><b>${esc(ug.display)}</b></div><div>${annualUnitSummary(ug)}</div></div>`;
    });
    h+='</div></div></div>';
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;
  if(document.getElementById('footerInfo'))document.getElementById('footerInfo').textContent=`Consolidado 2026 · ${sourceMonths.length} meses com dados · ${sourceRows.length} registros · indicadores recalculados automaticamente.`;
}

function render(){
  if(current==='2026'){renderAnnual();return;}
  if(current==='Consolidado'){renderConsolidated();return;}
  const arr=getRows();
  let h=`<div class="row g-3 mb-4">${renderCards(arr)}</div>`;
  h+=`<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-3">
    <div><h2 class="h5 fw-bold mb-1">Superintendentes</h2>
    <div class="small text-secondary">Clique no nome para visualizar as unidades e os detalhes do registro.</div></div>
    <div class="search d-flex align-items-center gap-2"><i class="bi bi-search text-secondary"></i>
    <input id="q" placeholder="Pesquisar superintendente ou unidade" oninput="setSearch(this.value)" value="${esc(SEARCH_QUERY)}"></div>
  </div><div class="row g-3">`;

  const groups={};
  arr.forEach(d=>{const key=personKey(d.superintendente)||'(SEM SUPERINTENDENTE)';if(!groups[key])groups[key]={name:titleName(d.superintendente)||'(Sem superintendente)',rows:[]};groups[key].rows.push(d);});
  Object.values(groups).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).forEach((group,i)=>{
    const name=group.name, id='s'+i, units=group.rows;
    h+=`<div class="col-12 col-md-6 col-xl-4"><div class="super">
      <div class="super-head d-flex justify-content-between align-items-center" onclick="toggle('${id}',this)">
        <div><div class="name">${esc(name)}</div><div class="meta">${units.length} unidade${units.length===1?'':'s'} de ensino</div></div>
        <i class="bi bi-chevron-down"></i>
      </div>
      <div id="${id}" class="unit-list d-none">${units.map((d,idx)=>{
        const [cl,st]=stat(d);
        return `<div class="unit" onclick="openUnit(${idx},'${esc(name).replaceAll("'","\\'")}')">
          <div class="d-flex justify-content-between gap-2"><b>${esc(d.unidade)}</b><span class="pill ${cl}">${st}</span></div>
          ${miniBadges(d)}
        </div>`;
      }).join('')}</div></div></div>`;
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;
  if(document.getElementById('footerInfo'))document.getElementById('footerInfo').textContent=`${MONTHS.join(', ')} · estrutura mensal por superintendente · filtros e indicadores recalculados automaticamente · ${MONTHS.length} meses carregados.`;
}

tabs();render();
</script></body></html>
